
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage Your Students Easily</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Welcome!</h2>
            <p>
                Welcome to our Student Management System.
                This application helps you manage student records
                in one place.
            </p>
        </section>

        <section class="card">
            <h2>Add New Student</h2>

            <form id="studentForm">

                <label>Student Name</label>
                <input type="text" id="name"
                    placeholder="Enter student name" required>

                <label>Roll Number</label>
                <input type="text" id="roll"
                    placeholder="Enter roll number" required>

                <label>Course</label>
                <input type="text" id="course"
                    placeholder="Enter course name" required>

                <button type="submit">Add Student</button>

            </form>
        </section>

        <section class="card">
            <h2>Student Records</h2>

            <input type="text" id="search"
                placeholder="Search student..."
                oninput="displayStudents()">

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Course</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentList"></tbody>
            </table>

            <h3>Total Students: <span id="total">0</span></h3>
        </section>

    </main>

    <footer>
        <p>© 2026 Student Management System</p>
    </footer>

    <script>

        let students = JSON.parse(
            localStorage.getItem("students") || "[]"
        );

        const form = document.getElementById("studentForm");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const roll = document.getElementById("roll").value.trim();
            const course = document.getElementById("course").value.trim();

            if (students.some(s => s.roll.toLowerCase() === roll.toLowerCase())) {
                alert("Roll number already exists!");
                return;
            }

            students.push({ name, roll, course });

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

            form.reset();
            displayStudents();

        });

        function displayStudents() {

            const list = document.getElementById("studentList");
            const search = document.getElementById("search")
                .value.toLowerCase();

            list.innerHTML = "";

            const filtered = students.filter(student =>
                student.name.toLowerCase().includes(search) ||
                student.roll.toLowerCase().includes(search)
            );

            filtered.forEach(student => {

                const row = document.createElement("tr");

                [student.name, student.roll, student.course].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const action = document.createElement("td");
                const button = document.createElement("button");

                button.textContent = "Delete";
                button.type = "button";

                button.onclick = function() {
                    students = students.filter(s => s !== student);

                    localStorage.setItem(
                        "students",
                        JSON.stringify(students)
                    );

                    displayStudents();
                };

                action.appendChild(button);
                row.appendChild(action);

                list.appendChild(row);

            });

            document.getElementById("total").textContent =
                students.length;

        }

        displayStudents();

    </script>

</body>
</html>
